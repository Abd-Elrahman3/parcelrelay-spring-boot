name: parcelrelay-learning
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: parcelrelay
      POSTGRES_USER: ${DB_USER:-learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learning_local_only}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.0.9-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-learning}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-learning_local_only}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: ["auth"]
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
    ports: ["127.0.0.1:8088:8080"]
    volumes: ["keycloak_data:/opt/keycloak/data"]
volumes:
  postgres_data:
  rabbit_data:
  keycloak_data:
